# Use with: docker compose -f compose.yaml -f compose.dev.yaml up --build
services:
  api:
    image: data-integration-platform:development
    build:
      target: development
    environment:
      NODE_ENV: development
    command: ['node', 'ace', 'serve', '--hmr', '--poll']
    volumes:
      - .:/app
      - api_node_modules:/app/node_modules

  worker:
    image: data-integration-platform:development
    environment:
      NODE_ENV: development
    command: ['node', 'ace', 'queue:work']
    volumes:
      - .:/app
      - worker_node_modules:/app/node_modules

volumes:
  api_node_modules:
  worker_node_modules:
